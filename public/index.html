<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gestionale Foto Pier</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="/shim.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<style>
/* Layout: barra laterale fissa + area di lavoro; su telefono la barra diventa fascia in alto */
:root{
  --bg:#f6f5f2; --panel:#ffffff; --ink:#1b1b1a; --muted:#6c6a66; --line:#e2dfd9;
  --accent:#2f8f4e; --accent-ink:#ffffff; --pale:#f0eeea;
  --good:#1f6f3f; --warn:#b7791f; --bad:#b3261e; --info:#2b6cb0;
  --font:'Montserrat',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141413; --panel:#1d1d1b; --ink:#f0eee9; --muted:#9b978f; --line:#2f2e2b; --pale:#262522;
  --accent:#5cc084; --accent-ink:#07210f; --good:#5bbd83; --warn:#e0a94a; --bad:#ef7a70; --info:#6aa7e6; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141413; --panel:#1d1d1b; --ink:#f0eee9; --muted:#9b978f; --line:#2f2e2b; --pale:#262522;
  --accent:#5cc084; --accent-ink:#07210f; --good:#5bbd83; --warn:#e0a94a; --bad:#ef7a70; --info:#6aa7e6; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.45;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100%}
.side{background:var(--panel);border-right:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh;height:100dvh}
.brand{font-weight:800;font-size:19px;letter-spacing:.02em;padding:0 10px 14px}
.brand small{display:block;font-weight:500;font-size:11px;color:var(--muted);letter-spacing:0;margin-top:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;color:var(--ink);text-decoration:none;font-weight:600;font-size:13px}
.nav a:hover{background:var(--pale)}
.nav a.on{background:var(--ink);color:var(--bg)}
.nav .count{margin-left:auto;font-size:11px;opacity:.7}
.side .foot{margin-top:auto;font-size:11px;color:var(--muted);padding:8px 10px}
main{padding:26px clamp(16px,3vw,36px) 60px;min-width:0;max-width:1400px;width:100%;margin:0 auto}
h1{font-size:26px;font-weight:800;margin:0 0 4px;letter-spacing:-.01em;text-wrap:balance}
h2{font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--ink);margin:0 0 12px;font-weight:700}
.sub{color:var(--muted);margin:0 0 22px}
.top{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;margin-bottom:18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px}
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(190px,1fr));margin-bottom:14px}
.kpi .l{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.kpi .v{font-size:27px;font-weight:800;margin-top:4px;letter-spacing:-.02em}
.kpi .n{font-size:12px;color:var(--muted);margin-top:2px}
.two{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.btn{border:1px solid var(--line);background:var(--panel);padding:9px 14px;border-radius:8px;cursor:pointer;font-weight:600;font-size:13px}
.btn:hover{background:var(--pale)}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.sm{padding:5px 10px;font-size:12px}
.btn.del{color:var(--bad)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11px;font-weight:700;background:var(--pale);white-space:nowrap}
.pill.good{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}
.pill.warn{background:color-mix(in srgb,var(--warn) 20%,transparent);color:var(--warn)}
.pill.bad{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.pill.info{background:color-mix(in srgb,var(--info) 16%,transparent);color:var(--info)}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700;padding:0 10px 8px}
td select{min-width:112px}
td{padding:10px;border-top:1px solid var(--line);vertical-align:middle}
td.r,th.r{text-align:right}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--pale)}
.scroll{overflow-x:auto}
.empty{color:var(--muted);padding:18px 4px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.item{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}
.item:first-of-type{border-top:0}
.item .d{width:50px;text-align:center;flex:none}
.item .d b{display:block;font-size:20px;line-height:1}
.item .d span{font-size:10px;text-transform:uppercase;color:var(--muted);letter-spacing:.07em}
.item .m{flex:1;min-width:0}
.item .m b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .m span{font-size:12px;color:var(--muted)}
.item .e{text-align:right;font-weight:700}
.item:hover .m b{color:var(--accent)}
.bars{display:flex;align-items:flex-end;gap:8px;height:140px;padding-top:8px}
.bar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;height:100%;min-width:0}
.bar i{display:block;width:100%;max-width:34px;background:var(--accent);border-radius:4px 4px 0 0;min-height:2px}
.bar i.in{background:var(--ink);opacity:.85}
.bar em{font-style:normal;font-size:10px;color:var(--muted)}
.legend{display:flex;gap:14px;font-size:11px;color:var(--muted);margin-top:8px}
.legend span:before{content:"";display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;background:var(--accent)}
.legend span.in:before{background:var(--ink)}
.legend span.ap:before{background:#e0b100}.legend span.po:before{background:#722f37}.legend span.al:before{background:#e8730c}.legend span.co:before{background:#3b9ede}.legend span.mc:before{background:#d93025}.legend span.mv:before{background:#2e9d5b}
/* form */
.f{display:grid;gap:10px;grid-template-columns:repeat(12,minmax(0,1fr));margin-bottom:10px}
.f label{display:flex;flex-direction:column;gap:4px;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;grid-column:span 4}
.f label.s2{grid-column:span 2}.f label.s3{grid-column:span 3}.f label.s6{grid-column:span 6}.f label.s8{grid-column:span 8}.f label.s12{grid-column:span 12}
input,select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:8px 10px;font-size:13.5px;width:100%;text-transform:none;letter-spacing:0;font-weight:500;min-width:0}
textarea{resize:vertical;min-height:64px}
.sect{margin-bottom:14px}
.svc{display:grid;grid-template-columns:24px minmax(110px,1.1fr) minmax(160px,2fr) 110px;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.svc.off{opacity:.55}
.nl{position:relative}.nl summary{list-style:none;cursor:pointer}.nl summary::-webkit-details-marker{display:none}
.nl[open]::before{content:'';position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:40}
.nlp{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:41;width:min(520px,92vw);max-height:72vh;overflow:auto;padding:16px;box-shadow:0 16px 48px rgba(0,0,0,.3)}
.nlp input.nls{width:100%;margin:8px 0 6px}
.nlr{display:flex;justify-content:space-between;gap:12px;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:10px 4px;cursor:pointer;font:inherit;color:inherit}.nlr:hover{background:rgba(0,0,0,.04)}
.lwr{display:grid;grid-template-columns:minmax(110px,.8fr) 150px minmax(180px,2fr);gap:10px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.lwr .lk{grid-column:1/-1}
.lwr input,.lwr select{padding:7px 9px;font-size:13px}
@media(max-width:700px){.lwr{grid-template-columns:1fr}}
.tsv{display:grid;grid-template-columns:minmax(80px,.6fr) minmax(130px,1.2fr) minmax(150px,1.6fr) 130px auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.tsv .lk{grid-column:1/-1}
.tsv input,.tsv select{padding:6px 8px;font-size:13px}
.twd{margin-top:14px;border-left:4px solid var(--accent)}
.twd a{color:inherit;text-decoration:none}.twd a.btn:hover{background:rgba(0,0,0,.04)}.twd a b:hover{text-decoration:underline}
@media(max-width:700px){.tsv{grid-template-columns:1fr 1fr}.tsv>*:nth-child(n+3){grid-column:span 2}}
.svc .nm{font-weight:700}
.svc input,.svc select{padding:6px 8px;font-size:13px}
.team{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.chip{border:1px solid var(--line);background:var(--pale);border-radius:99px;padding:2px 9px;font-size:11.5px;font-weight:600;cursor:pointer}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.add{border-style:dashed;background:transparent}
.sum{display:grid;gap:0;max-width:340px;margin-left:auto;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.sum div{display:flex;justify-content:space-between;padding:9px 14px;border-top:1px solid var(--line);font-weight:600}
.sum div:first-child{border-top:0;background:var(--pale)}
.sum div:last-child{background:var(--ink);color:var(--bg);font-size:16px;font-weight:800}
.hint{font-size:12px;color:var(--muted)}
.cal{border-left:6px solid var(--accent);background:var(--pale);padding:12px 14px;border-radius:0 10px 10px 0}
.cal b{font-size:20px;letter-spacing:.04em}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:9px;font-weight:600;z-index:9;max-width:90vw}
.banner{background:color-mix(in srgb,var(--warn) 16%,transparent);border:1px solid var(--warn);padding:9px 12px;border-radius:9px;margin-bottom:14px;font-size:12.5px}
.search{max-width:300px}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cd{min-height:52px;border:1px solid var(--line);border-radius:7px;padding:4px 6px;font-size:11px;display:flex;flex-direction:column;gap:2px;text-decoration:none;color:inherit;min-width:0}
.cd.h{min-height:0;border:0;font-weight:700;color:var(--muted);font-size:10px;text-align:center;padding:0 0 2px}
.cd b{font-size:12px}
.cd.t{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.cd.w{background:#d93025;color:#fff;border-color:#d93025}
.cd.w.att{background:#2e9d5b;color:#fff;border:1px solid #2e9d5b}.cd.w span{font-weight:700;font-size:10.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cd.ap{border-color:#e0b100;background:#fff3b0;color:#5a4500}
.formrow{grid-template-columns:repeat(5,minmax(0,1fr))!important;gap:12px}@media(max-width:1300px){.formrow{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))!important}}.fcard{display:flex;flex-direction:column}.fcard>.row:last-child{margin-top:auto!important;padding-top:12px}.fcard>.row:last-child .btn{width:100%;min-width:200px;justify-content:center;text-align:center;box-sizing:border-box}.fcard>.row:last-child{flex-wrap:wrap}
.cd.ap.alb{border-color:#e8730c;background:#ffd9b0;color:#5a2a00}.cd.ap.alb span{color:#5a2a00}.cd.ap.post{border-color:#722f37;background:#f1dde0;color:#4a1b21}.cd.ap.post span{color:#4a1b21}.cd.ap.con{border-color:#3b9ede;background:#d6ebfa;color:#0b3a5c}.cd.ap.con span{color:#0b3a5c}
.cd.ap span{font-weight:700;font-size:10.5px;color:#5a4500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.att{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line);text-decoration:none;color:inherit;font-weight:600;font-size:13px}
.att:first-of-type{border-top:0}
.att i{width:9px;height:9px;border-radius:50%;margin-top:5px;flex:none;background:var(--info)}
.att.warn i{background:var(--warn)}.att.bad i{background:var(--bad)}
.att:hover span{color:var(--accent)}
.lw{display:block;padding:14px 0;border-top:1px solid var(--line);text-decoration:none;color:inherit}
.lw:first-of-type{border-top:0;padding-top:0}
.lw:hover b{color:var(--accent)}
.svr{display:grid;grid-template-columns:130px minmax(0,1fr) auto;gap:10px;align-items:center;padding:6px 0 0;font-size:13px}
.svr .nm{font-weight:700}
.who{border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}main{min-width:0;max-width:100vw}
  .side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;padding:12px 14px;border-right:0;border-bottom:1px solid var(--line)}
  .brand{padding:0 8px 0 0}.brand small,.side .foot{display:none}
  .nav{display:flex;gap:4px;flex-wrap:wrap}.nav a{padding:8px 10px}
  .svc{grid-template-columns:24px 1fr 1fr;}
  .svc>*:nth-child(n+4){grid-column:span 3}
  .f label,.f label.s2,.f label.s3,.f label.s6,.f label.s8{grid-column:span 6}
  .f label.s12{grid-column:span 12}
}
@media (prefers-reduced-motion:no-preference){.card{transition:border-color .15s}.card:hover{border-color:color-mix(in srgb,var(--accent) 35%,var(--line))}}
tr.rc td{border-top:2px solid var(--b);border-bottom:2px solid var(--b)}tr.rc td:first-child{border-left:2px solid var(--b);border-radius:8px 0 0 8px}tr.rc td:last-child{border-right:2px solid var(--b);border-radius:0 8px 8px 0}
tr.rok{--b:#2e9d5b}tr.rok td{background:rgba(46,157,91,.22)}
tr.rrd{--b:#d93025}tr.rrd td{background:rgba(217,48,37,.2)}tr.rno{--b:#e0b100}tr.rno td{background:rgba(224,177,0,.13)}
.cd.day{min-height:104px;gap:4px;padding:6px}
.cd.day .ev{display:block;border-radius:5px;padding:3px 6px;font-size:11.5px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-decoration:none;color:#fff;background:#d93025}
.cd.day .ev.att{background:#2e9d5b}
.cd.day .ev.ap{background:#e0b100;color:#3d2f00}.cd.day .ev.ap.alb{background:#e8730c;color:#fff}.cd.day .ev.ap.post{background:#722f37;color:#fff}.cd.day .ev.ap.con{background:#3b9ede;color:#fff}
.cal-grid{gap:6px}

@media(max-width:900px){.dashcal{grid-template-columns:minmax(0,1fr)}.dashcal>*{min-width:0}}
.cal-grid .cd:not(.h){height:104px;min-height:104px;overflow-x:hidden;overflow-y:auto;box-sizing:border-box}
.cal-grid .cd.day::-webkit-scrollbar{width:4px}

.cal-ag{display:none}
.agd{display:grid;grid-template-columns:46px 1fr;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.agd.t{background:color-mix(in srgb,var(--accent) 10%,transparent);border-radius:8px;padding-left:6px}
.agn{text-align:center;line-height:1.1}.agn b{display:block;font-size:20px}.agn span{font-size:11px;text-transform:uppercase;color:var(--muted)}
.agl{display:flex;flex-direction:column;gap:5px;min-width:0}
.agl .ev{display:block;border-radius:7px;padding:7px 10px;font-size:14px;text-decoration:none;color:#fff;background:#d93025;line-height:1.3}
.agl .ev.att{background:#2e9d5b}.agl .ev.ap{background:#e0b100;color:#3d2f00}.agl .ev.ap.alb{background:#e8730c;color:#fff}.agl .ev.ap.post{background:#722f37;color:#fff}.agl .ev.ap.con{background:#3b9ede;color:#fff}
@media(max-width:700px){
html,body{overflow-x:hidden;max-width:100vw}.grid,.two,.kpis,.formrow{min-width:0}.grid>*,.formrow>*{min-width:0}.legend span{white-space:normal}.card{max-width:100%;box-sizing:border-box}.legend{flex-wrap:wrap}
.calcard{padding:12px 2px 12px;border-radius:12px}.calcard>.row{padding:0 10px}
.cal-grid{gap:0;border-top:1px solid var(--line)}
.cal-grid .cd{border:0;border-radius:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:2px 1px;gap:2px}
.cal-grid .cd:nth-child(7n){border-right:0}
.cal-grid .cd:not(.h){height:auto;min-height:92px;max-height:92px;overflow:hidden}
.cal-grid .cd.h{font-size:11px;padding:4px 0}
.cal-grid .cd.day>b{font-size:12px;text-align:center;font-weight:600}
.cal-grid .cd.day.t>b{background:#1a73e8;color:#fff;border-radius:50%;width:20px;height:20px;line-height:20px;margin:0 auto}
.cal-grid .cd.t{box-shadow:none;border-color:var(--line)}
.cd.day .ev{font-size:9.5px;padding:2px 3px;border-radius:3px;font-weight:600;line-height:1.15;pointer-events:none}
.legend{font-size:10px;gap:8px;padding:0 10px}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">FOTO PIER<small>Gestionale matrimoni</small></div>
    <nav class="nav" id="nav"></nav>
    <div class="foot" id="foot"></div>
  </aside>
  <main id="main"></main>
</div>
<div id="toast" class="toast" hidden></div>

<script>
(function(){
'use strict';
/* ---------- utilità ---------- */
var $=function(s,r){return (r||document).querySelector(s)};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function num(v){var n=parseFloat(String(v==null?'':v).replace(/\./g,function(m,i,s){return /,/.test(s)?'':m}).replace(',','.'));return isFinite(n)?n:0}
function eur(n){var v=Math.round(Number(n||0)*100)/100,neg=v<0;v=Math.abs(v);var p=v.toFixed(2).split('.');p[0]=p[0].replace(/\B(?=(\d{3})+(?!\d))/g,'.');return (neg?'-':'')+p[0]+','+p[1]+' \u20ac'}
function two(n){return (n<10?'0':'')+n}
function parseD(s){if(!s)return null;var p=String(s).split('-');return new Date(+p[0],+p[1]-1,+p[2])}
var MESI=['gennaio','febbraio','marzo','aprile','maggio','giugno','luglio','agosto','settembre','ottobre','novembre','dicembre'];
var MESI3=['gen','feb','mar','apr','mag','giu','lug','ago','set','ott','nov','dic'];
function delWedding(w){calDelIds([w.calEventId].concat((w.appuntamenti||[]).map(function(x){return x.calEventId})));S.weddings=S.weddings.filter(function(x){return x.id!==w.id});if(S.db)S.db.doc('matrimoni/'+w.id).delete().catch(function(){toast('Eliminazione non riuscita')})}
async function calDelIds(ids){ids=(ids||[]).filter(Boolean);if(!ids.length)return;try{var mcp=await claude.use('mcp');for(var i=0;i<ids.length;i++)await mcp.callTool('Google Calendar','delete_event',{calendarId:S.set.calendarId||'weddingfotopier@gmail.com',eventId:ids[i]});toast('Tolto anche da Google Calendar')}catch(e){toast('Su Google Calendar non rimosso')}}
function dlong(s){var d=parseD(s);return d?d.getDate()+' '+MESI[d.getMonth()]+' '+d.getFullYear():''}
function dshort(s){var d=parseD(s);return d?two(d.getDate())+'/'+two(d.getMonth()+1)+'/'+d.getFullYear():''}
function todayStr(){var d=new Date();return d.getFullYear()+'-'+two(d.getMonth()+1)+'-'+two(d.getDate())}
function daysTo(s){var d=parseD(s);if(!d)return null;var t=parseD(todayStr());return Math.round((d-t)/86400000)}
function toast(m){var t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(function(){t.hidden=true},3200)}

/* ---------- modello ---------- */
var SERVIZI=[
  {k:'foto',label:'Servizio fotografico',desc:'Solo servizio fotografico'},
  {k:'fotolibro',label:'Fotolibro',desc:''},
  {k:'album',label:'Album genitori',desc:''},

function admData(list){
  var c={};CATS.forEach(function(x){c[x[0]]={tot:0,inc:0,sco:0}});
  var T={tot:0,inc:0,sco:0};
  list.forEach(function(w){

  });
  return {c:c,T:T};
}

function bindW(w){
  var m=$('#main');
  function changed(rerender){syncFinito(w);S._shown=JSON.stringify(w);persist(w);if(rerender){var y=window.scrollY;m.innerHTML=viewW(w);bindW(w);window.scrollTo(0,y)}}
  m.querySelectorAll('[data-p]').forEach(function(el){
    el.addEventListener('input',function(){setp(w,el.dataset.p,el.value);S._shown=JSON.stringify(w);persist(w);if(el.dataset.p==='sposo.nome'||el.dataset.p==='sposa.nome'){var h=$('h1');if(h)h.textContent=nomiSposi(w)}});
    el.addEventListener('change',function(){if(el.dataset.p==='data'||el.dataset.p==='condivisione')changed(true)});
  });
  m.querySelectorAll('[data-sp]').forEach(function(el){
    el.addEventListener('change',function(){
      var a=el.dataset.sp.split('.');var s=w.servizi[+a[0]];var f=a[1];
      if(el.type==='checkbox'&&!el.checked&&s.attivo){el.checked=true;svcPop(w,+a[0],function(){changed(true)});return}
      if(el.type==='checkbox'){s[f]=el.checked;
        if(!el.checked){var df=SERVIZI.filter(function(x){return x.k===s.k})[0];s.desc=df?df.desc:'';s.prezzo=0;s.team=[];s.stato='da_fare';s.link=''}
        if(el.checked&&(s.k==='foto'||s.k==='fotolibro')){var o=s.k==='foto'?'fotolibro':'foto';w.servizi.forEach(function(x){if(x.k===o&&x.attivo){x.attivo=false;toast(svcLabel(s.k)+' e '+svcLabel(o)+' non si possono scegliere insieme: tolto '+svcLabel(o))}})}
        changed(true);return}
      if(f==='prezzo'){s[f]=num(el.value);changed(true);return}
      if(f==='stato'){
        if(el.value==='consegnato'&&saldo(w)>0.005){toast('Consegna bloccata: saldo da incassare '+eur(saldo(w)));el.value=s.stato;return}
      }
      s[f]=el.value;
      if(f==='desc'){var it=S.listino.filter(function(x){return x.cat===catOf(s.k)&&x.nome===el.value})[0];if(it&&it.prezzo){s.prezzo=num(it.prezzo);changed(true);return}}
      changed(f==='stato');
    });
  });
  m.querySelectorAll('[data-tm]').forEach(function(b){b.addEventListener('click',function(){var s=w.servizi[+b.dataset.tm];s.team=s.team||[];var n=b.dataset.n,ix=s.team.indexOf(n);if(ix>=0)s.team.splice(ix,1);else s.team.push(n);changed(true)})});
  m.querySelectorAll('[data-addtm]').forEach(function(b){b.addEventListener('click',function(){
    var cell=b.parentNode;b.remove();var i=document.createElement('input');i.placeholder='Nome';i.style.width='110px';i.style.padding='3px 8px';cell.appendChild(i);i.focus();
    var done=false;function ok(){if(done)return;done=true;var n=i.value.trim();if(n){if(S.set.team.indexOf(n)<0){S.set.team.push(n);persistSet()}var s=w.servizi[+b.dataset.addtm];s.team=s.team||[];if(s.team.indexOf(n)<0)s.team.push(n)}changed(true)}
    i.addEventListener('keydown',function(e){if(e.key==='Enter')ok();if(e.key==='Escape'){done=true;changed(true)}});i.addEventListener('blur',ok)})});
  m.querySelectorAll('[data-pp]').forEach(function(el){
    el.addEventListener('change',function(){var a=el.dataset.pp.split('.');var p=w.pagamenti[+a[0]],f=a[1];
      if(el.type==='checkbox')p[f]=el.checked;else if(f==='importo')p[f]=num(el.value);else p[f]=el.value;
      if(f==='tipo'&&el.value==='sconto'){p.metodo='';p.ricevuto='';p.fatturato=false}
      changed(f==='importo'||f==='tipo')})});
  m.querySelectorAll('[data-delp]').forEach(function(b){b.addEventListener('click',function(){w.pagamenti.splice(+b.dataset.delp,1);changed(true)})});
  m.querySelectorAll('[data-ap]').forEach(function(el){el.addEventListener('change',function(){var a=el.dataset.ap.split('.');var p=w.appuntamenti[+a[0]];p[a[1]]=el.type==='checkbox'?el.checked:el.value;changed(a[1]==='fatto'||a[1]==='data')})});
  m.querySelectorAll('[data-delap]').forEach(function(b){b.addEventListener('click',function(){var rm=w.appuntamenti.splice(+b.dataset.delap,1)[0];if(rm&&rm.calEventId)calDelIds([rm.calEventId]);changed(true)})});
  $('#addAp').addEventListener('click',function(){w.appuntamenti=w.appuntamenti||[];w.appuntamenti.push({tipo:TIPI_APP[0],data:'',ora:'',note:'',fatto:false});changed(true)});
  $('#attBtn').addEventListener('click',async function(){
    if(w.attesa&&!this.dataset.armed){var bt=this;bt.dataset.armed='1';bt.textContent='Sicuro? Clicca di nuovo per confermare';setTimeout(function(){if(document.body.contains(bt)){delete bt.dataset.armed;bt.textContent='Conferma matrimonio'}},4000);return}
    w.attesa=!w.attesa;if(!w.attesa)delete w.attesa;persist(w);
    if(w.calEventId&&w.data){try{await calSync(w)}catch(e){toast('Calendario non aggiornato: '+calErr(e))}}
    m.innerHTML=viewW(w);bindW(w)});
  $('#calBtn').addEventListener('click',async function(){
    var btn=$('#calBtn'),msg=$('#calMsg');
    function say(t){msg.textContent=t}
    if(!w.data){return}
    btn.disabled=true;say('Creo l\u2019evento…');
    try{
      var upd=await calSync(w);
      persist(w);toast(upd?'Evento aggiornato':'Evento creato in Google Calendar');
      say('Genero il contratto: Drive, email agli sposi, allegato all\u2019evento…');
      await makePdf(w,false,true);
      m.innerHTML=viewW(w);bindW(w);
    }catch(e){
      btn.disabled=false;var c=e&&e.code;
      if(c==='approval_required'||c==='consent_required'||c==='not_in_manifest')say('Serve il tuo permesso: conferma la richiesta di Google Calendar quando compare.');
      else if(c==='needs_reauth'||c==='server_not_connected')say('Google Calendar non è collegato: ricollegalo in claude.ai, Impostazioni, Connettori.');
      else if(c==='tool_error')say('Google ha rifiutato: '+String((e.message||'').slice(0,140))+' (controlla di avere i permessi di modifica sul calendario).');
      else say('Non riuscito ('+(c||'errore')+'). Riprova tra poco.');
    }
  });
  $('#cont').addEventListener('click',function(){w.contanti=!w.contanti;if(!w.contanti)delete w.contanti;changed(true)});
  $('#addP').addEventListener('click',function(){w.pagamenti.push({tipo:'acconto',data:todayStr(),importo:0,metodo:'',ricevuto:'',fatturato:false});changed(true)});
  if(w===S.bozza){
    $('#okBozza').addEventListener('click',function(){
      if(!((w.sposo.nome||'').trim()||(w.sposa.nome||'').trim())){toast('Inserisci almeno il nome di uno dei due sposi');return}
      S.bozza=null;S.weddings.push(w);persist(w);toast('Contratto salvato');route()});
    $('#noBozza').addEventListener('click',function(){S.bozza=null;location.hash='matrimoni'});
    $('#linkBozza').addEventListener('click',function(){linkPop(w)});
    return;
  }
  $('#pdf').addEventListener('click',function(){makePdf(w)});
  $('#mailPdf').addEventListener('click',function(){
    var b=this,em=mailOf(w);
    if(!em){toast('Scrivi prima l\'email degli sposi e salva');return}
    if(!b.dataset.armed){b.dataset.armed='1';b.textContent='Invia a '+em+'? Clicca ancora';setTimeout(function(){if(document.body.contains(b)){delete b.dataset.armed;b.textContent='Invia copia all\'email'}},5000);return}
    delete b.dataset.armed;b.textContent='Invia copia all\'email';makePdf(w,true)});
  $('#delW').addEventListener('click',function(){
    var b=$('#delW');if(!b.dataset.sure){b.dataset.sure='1';b.textContent='Conferma eliminazione';setTimeout(function(){if(b){b.textContent='Elimina';delete b.dataset.sure}},4000);return}
    calDelIds([w.calEventId].concat((w.appuntamenti||[]).map(function(x){return x.calEventId})));
    S.weddings=S.weddings.filter(function(x){return x.id!==w.id});
    if(S.db)S.db.doc('matrimoni/'+w.id).delete().catch(function(){toast('Eliminazione non riuscita')});
    location.hash='matrimoni';toast('Matrimonio eliminato');
  });
}
function mergeVuoti(dst,src){Object.keys(src).forEach(function(k){var v=src[k],d=dst[k];
  if(k==='id'||k==='anno'||k==='numero'||k==='creato'||k==='servizi'||k==='pagamenti'||k==='appuntamenti'||k==='contratto'||k==='contrattoData')return;
  if(v&&typeof v==='object'&&!Array.isArray(v)){if(d&&typeof d==='object')mergeVuoti(d,v)}
  else if(typeof v==='string'&&v.trim()&&(d===undefined||d===''))dst[k]=v})}
